# H2 Database Profile (for local development without PostgreSQL)
server:
  port: 8888

spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:hidearea_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true

logging:
  level:
    net.hidearea: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
