services:
  postgres:
    image: postgres:15-alpine
    container_name: hidearea-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-hidearea_dev}
      POSTGRES_USER: ${DB_USERNAME:-hidearea}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hidearea}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hidearea-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hidearea}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hidearea-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hidearea_dev}
      DB_USERNAME: ${DB_USERNAME:-hidearea}
      DB_PASSWORD: ${DB_PASSWORD:-hidearea}
      JWT_SECRET: ${JWT_SECRET:-changeThisToASecureRandomStringInProduction}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hidearea-network
    volumes:
      - ./backend:/app
    command: ./gradlew bootRun

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hidearea-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - hidearea-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres-data:
    driver: local

networks:
  hidearea-network:
    driver: bridge
